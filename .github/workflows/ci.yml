# Continuous integration for the self-hosted toolchain, which bootstraps from
# bootstrap/seed.s with GNU binutils (as/ld) alone; the tests are Python
# standard-library unittests. The Ubuntu runners have both; the burn job also
# installs Node, for the
# tree-sitter CLI of the editor-grammar tests and the VS Code extension's
# server choice, gdb for the debug-information tests, and Go for the oracle
# of test_regex. The runners are
# pinned (ubuntu-24.04: its python3 is 3.12, which gdb embeds). The vscode-extension job typechecks, lints and tests the VS
# Code extension and uploads its .vsix. On a push to master the bootstrap
# jobs upload the commit's seeds and each machine's myla and myla-lsp (D207).
# See docs/Development/Testing.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  burn:
    name: Burn tests (native builds, error corpus, self-hosting gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # the runner's own python3 (3.12), not actions/setup-python: that sets
      # LD_LIBRARY_PATH to its libpython, which gdb then embeds instead of its
      # own, and the pretty-printers the binaries embed (D82) don't run
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/tree-sitter-myla/package-lock.json
      # the oracle of test_regex's Go half (MYLA-555): without go it skipped
      # here unnoticed; test_regex.GoOracle now fails without it
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache: false
      - name: gdb for the debug-information tests (MYLA-156); clang, lld and qemu-user for the aarch64 ones (MYLA-163)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb clang lld qemu-user
          gdb --version | head -1
          clang --version | head -1
          ld.lld --version | head -1
          qemu-aarch64 --version | head -1
      # the self-hosted tools the burn tests build, keyed on every source
      # that can change them (as tests/burn/_tools.py's own hash is)
      - uses: actions/cache@v6
        with:
          path: build/test-tools
          key: test-tools-${{ hashFiles('lib/std/*.my', 'selfhost/*.my', 'tools/**/*.my', 'bootstrap/seed.s') }}
      - name: tree-sitter CLI for the editor-grammar tests (MYLA-77)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts --prefix editor/tree-sitter-myla
          cd editor/tree-sitter-myla/node_modules/tree-sitter-cli && node install.js
      - name: Toolchain versions
        run: |
          python3 --version
          as --version | head -1
          ld --version | head -1
          go version
          editor/tree-sitter-myla/node_modules/.bin/tree-sitter --version
      - name: Burn tests
        # a target whose tools are missing fails instead of skipping (MYLA-268)
        env:
          MYLA_REQUIRE_TARGETS: "1"
        run: python3 -m unittest discover -s tests/burn -t . -v

  targets:
    # the parity, runtime-error, error-corpus, I/O and feature suites built
    # for each other target and run under qemu-aarch64 or Node, with the
    # exceptions tests/burn/_targets.py lists (MYLA-268)
    name: Burn suites on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux, wasm32-wasi]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: clang, lld (ld.lld, wasm-ld) and qemu-user
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld qemu-user
      - uses: actions/cache@v6
        with:
          path: build/test-tools
          key: test-tools-${{ hashFiles('lib/std/*.my', 'selfhost/*.my', 'tools/**/*.my', 'bootstrap/seed.s') }}
      - name: The suites for ${{ matrix.target }}
        # missing target tools fail the job instead of skipping every suite
        # (MYLA-297)
        env:
          MYLA_REQUIRE_TARGETS: "1"
        run: python3 scripts/test-target.py ${{ matrix.target }}

  wasm-page:
    # the playground page (tools/wasm/page.html) in Chromium through
    # Playwright: its example run, a type error shown, a runtime error and
    # an endless recursion (D158, MYLA-297)
    name: The wasm playground page in a browser
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: clang and lld (wasm-ld)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
      - name: Playwright with its Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - uses: actions/cache@v6
        with:
          path: build/test-tools
          key: test-tools-${{ hashFiles('lib/std/*.my', 'selfhost/*.my', 'tools/**/*.my', 'bootstrap/seed.s') }}
      - name: The page's test (fails, not skips, without Playwright)
        env:
          MYLA_REQUIRE_BROWSER: "1"
        run: python3 -m unittest tests.burn.test_wasm.WasmBrowser tests.burn.test_wasm.BrowserTools -v

  bootstrap:
    name: Bootstrap fixed point
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # from the seed: as and ld only, no Python (MYLA-218)
      - name: Build stage 0–3 from bootstrap/seed.s and compare stage2.s with stage3.s
        run: scripts/bootstrap.sh build
      - name: The seed bootstraps the sources and the embedded library is current (D207)
        run: scripts/check-seed.sh build
      - name: Self-hosted compiler builds and runs an example
        run: |
          build/stage3 examples/hello.my lib > build/hello.s
          as --64 -o build/hello.o build/hello.s
          ld -o build/hello build/hello.o
          build/hello
      # each master commit's seeds, for every target, and this machine's
      # tools, as workflow artifacts (D207, MYLA-629): the seeds a commit
      # bootstraps from stay committed, as artifacts expire; tagged releases
      # can replace these later. The tools go in a tarball, which keeps
      # their executable bit (an artifact's zip doesn't)
      - name: The seeds of this commit and the x86-64 tools (master only)
        if: github.event_name == 'push'
        run: |
          scripts/update-seed.sh --out build/artifacts/seeds
          tar -czf build/artifacts/myla-x86_64-linux.tar.gz -C build myla myla-lsp
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: myla-seeds-${{ github.sha }}
          path: build/artifacts/seeds/*.s
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: myla-x86_64-linux-${{ github.sha }}
          path: build/artifacts/myla-x86_64-linux.tar.gz
          if-no-files-found: error
          retention-days: 90

  bootstrap-arm64:
    # what a Raspberry Pi 4 with a 64-bit OS does (MYLA-276, D127): `just
    # bootstrap` from the aarch64 seed with the machine's own as and ld, then
    # build/myla targets the machine without --target
    name: Bootstrap on aarch64 (just bootstrap)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: just
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq just
      - name: just bootstrap (bootstrap/seed-aarch64.s, stages 0–3, the fixed point)
        run: just bootstrap
      - name: The aarch64 seed bootstraps the sources and the embedded library is current (D207)
        run: scripts/check-seed.sh build
      - name: This machine's tools (master only, D207)
        if: github.event_name == 'push'
        run: |
          mkdir -p build/artifacts
          tar -czf build/artifacts/myla-aarch64-linux.tar.gz -C build myla myla-lsp
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: myla-aarch64-linux-${{ github.sha }}
          path: build/artifacts/myla-aarch64-linux.tar.gz
          if-no-files-found: error
          retention-days: 90
      - name: Every example built for this machine gives what the interpreter gives
        run: |
          fail=0
          for f in examples/*.my; do
            name=$(basename "$f" .my)
            [ "$name" = args ] && continue    # argv[0] differs: the binary's path
            build/myla build "$f" -o "build/ex_$name" || { echo "build failed: $f"; fail=1; continue; }
            want=$(build/myla run "$f" < /dev/null 2>&1; echo "exit $?")
            got=$("build/ex_$name" < /dev/null 2>&1; echo "exit $?")
            [ "$want" = "$got" ] || { echo "differs: $f"; fail=1; }
          done
          exit $fail
      # the runtime's lock-free protocols on a weakly ordered processor
      # (MYLA-267): each stress program 20 times on 1, 4 and 16 workers
      - name: The concurrency stress programs on this machine's memory order
        run: python3 scripts/stress-native.py --runs 20
      # closures crossing tasks, which this machine once crashed on (2 runs
      # of 20 of t18, MYLA-267), and its three parts on their own
      - name: Closures across tasks, 100 runs each on 4 workers
        run: python3 scripts/stress-native.py --runs 100 --workers 4 --only t18_closures_cross_tasks --only t19_closures_to_children --only t20_siblings_clone_a_closure --only t21_composition_to_a_child
      # the litmus programs of the runtime's protocols (MYLA-301): a child's
      # result and its awaiter, park and push, cancel and sleep, timers armed
      # and fired, descriptors watched; which qemu, in the targets job, can't
      # reorder (MYLA-297)
      - name: The runtime's litmus programs, 1,000 runs each on 4 and 16 workers
        run: python3 scripts/stress-native.py --runs 1000 --workers 4,16 --only t23_results_seen_by_their_awaiter --only t24_cancelled_sleepers --only t25_timers_fire --only t26_tasks_yield --only t27_children_read_as_they_write

  vscode-extension:
    name: VS Code extension (typecheck, lint, tests, .vsix)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension/myla
    steps:
      - uses: actions/checkout@v7
      # the debugger's integration test builds Myla programs with the
      # self-hosted CLI (build/myla build -g, bootstrapped here from the seed)
      # and debugs them with gdb. gdb uses the runner's own python3 (3.12) for
      # the pretty-printers the binaries embed (D82): actions/setup-python
      # would set LD_LIBRARY_PATH to its libpython, which gdb then embeds
      - name: Bootstrap build/myla for the debugger tests
        working-directory: .
        run: scripts/bootstrap.sh build
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/myla/package-lock.json
      - name: gdb for the debugger tests (MYLA-99)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          gdb --version | head -1
          python3 --version
          gdb -batch -ex "python import sys; print('gdb embeds Python', sys.version.split()[0])"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (unit, the bundle, the debug adapter against gdb)
        run: npm test
      - name: Package the .vsix
        run: npx vsce package
      - name: List the .vsix
        run: unzip -l *.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: myla-vscode-extension
          path: vscode-extension/myla/*.vsix
          if-no-files-found: error

  website:
    # the website (D208, MYLA-159): play.wasm, the docs from the wiki, the
    # reference from lib/std (tools/doc) and the course from learn/, built
    # for GitHub Pages (/myla/); the content pipeline's and the app's unit
    # tests; the built site in Chromium. On a push to master the pages job
    # deploys it. The course's exercises are checked by the burn job
    # (tests/burn/test_website.py).
    name: Website (unit tests, build, the site in a browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - name: clang and lld (wasm-ld, for play.wasm)
        working-directory: .
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld
      - name: Bootstrap build/myla
        working-directory: .
        run: scripts/bootstrap.sh build
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests (the content pipeline, the gamification, the editor's Myla mode)
        run: npm test
      - name: Build for GitHub Pages
        run: npm run build:pages
      - name: Every exercise in play.wasm, as the learner's browser runs it
        run: npm run check-course
      - name: Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: The built site in Chromium
        env:
          CI: "1"
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: website
          path: website/dist
          retention-days: 7

  pages:
    # master only: the site of the website job, with the master build's tools
    # and the VS Code extension under downloads/ (MYLA-635)
    name: Deploy the website to GitHub Pages
    if: github.event_name == 'push'
    needs: [website, bootstrap, bootstrap-arm64, vscode-extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: website
          path: site
      - uses: actions/download-artifact@v7
        with:
          pattern: myla-*-linux-${{ github.sha }}
          path: artifacts
      - uses: actions/download-artifact@v7
        with:
          name: myla-vscode-extension
          path: artifacts
      - name: The downloads and their manifest
        run: node website/scripts/downloads.mjs artifacts site/downloads ${{ github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
