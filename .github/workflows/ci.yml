# Continuous integration for the self-hosted toolchain, which bootstraps from
# bootstrap/seed.s with GNU binutils (as/ld) alone; the tests are Python
# standard-library unittests. The Ubuntu runners have both; the burn job also
# installs Node, for the
# tree-sitter CLI of the editor-grammar tests and the VS Code extension's
# server choice, and gdb for the debug-information tests. The runners are
# pinned (ubuntu-24.04: its python3 is 3.12, which gdb embeds). The vscode-extension job typechecks, lints and tests the VS
# Code extension and uploads its .vsix. See docs/Development/Testing.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  burn:
    name: Burn tests (native builds, error corpus, self-hosting gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # the runner's own python3 (3.12), not actions/setup-python: that sets
      # LD_LIBRARY_PATH to its libpython, which gdb then embeds instead of its
      # own, and the pretty-printers the binaries embed (D82) don't run
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/tree-sitter-myla/package-lock.json
      - name: gdb for the debug-information tests (MYLA-156)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          gdb --version | head -1
      # the self-hosted tools the burn tests build, keyed on every source
      # that can change them (as tests/burn/_tools.py's own hash is)
      - uses: actions/cache@v6
        with:
          path: build/test-tools
          key: test-tools-${{ hashFiles('src/myla/std/*.my', 'selfhost/*.my', 'tools/**/*.my', 'bootstrap/seed.s') }}
      - name: tree-sitter CLI for the editor-grammar tests (MYLA-77)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts --prefix editor/tree-sitter-myla
          cd editor/tree-sitter-myla/node_modules/tree-sitter-cli && node install.js
      - name: Toolchain versions
        run: |
          python3 --version
          as --version | head -1
          ld --version | head -1
          editor/tree-sitter-myla/node_modules/.bin/tree-sitter --version
      - name: Burn tests
        run: python3 -m unittest discover -s tests/burn -t . -v

  bootstrap:
    name: Bootstrap fixed point
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # from the seed: as and ld only, no Python (MYLA-218)
      - name: Build stage 0–3 from bootstrap/seed.s and compare stage2.s with stage3.s
        run: scripts/bootstrap.sh build
      - name: The seed is the current compiler (else run scripts/update-seed.sh and commit it)
        run: scripts/check-seed.sh build
      - name: Self-hosted compiler builds and runs an example
        run: |
          build/stage3 examples/hello.my src/myla > build/hello.s
          as --64 -o build/hello.o build/hello.s
          ld -o build/hello build/hello.o
          build/hello

  vscode-extension:
    name: VS Code extension (typecheck, lint, tests, .vsix)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension/myla
    steps:
      - uses: actions/checkout@v7
      # the debugger's integration test builds Myla programs with the
      # self-hosted CLI (build/myla build -g, bootstrapped here from the seed)
      # and debugs them with gdb. gdb uses the runner's own python3 (3.12) for
      # the pretty-printers the binaries embed (D82): actions/setup-python
      # would set LD_LIBRARY_PATH to its libpython, which gdb then embeds
      - name: Bootstrap build/myla for the debugger tests
        working-directory: .
        run: scripts/bootstrap.sh build
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/myla/package-lock.json
      - name: gdb for the debugger tests (MYLA-99)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          gdb --version | head -1
          python3 --version
          gdb -batch -ex "python import sys; print('gdb embeds Python', sys.version.split()[0])"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (unit, the bundle, the debug adapter against gdb)
        run: npm test
      - name: Package the .vsix
        run: npx vsce package
      - name: List the .vsix
        run: unzip -l *.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: myla-vscode-extension
          path: vscode-extension/myla/*.vsix
          if-no-files-found: error
