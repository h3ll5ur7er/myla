# Continuous integration for the Python toolchain and the self-hosted compiler.
# Everything here uses only the standard library plus GNU binutils (as/ld), which
# the Ubuntu runners already have; the burn job also installs Node, for the
# tree-sitter CLI of the editor-grammar tests and the VS Code extension's
# server choice. The vscode-extension job typechecks, lints and tests the VS
# Code extension and uploads its .vsix. See docs/Development/Testing.md.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and integration tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -t .
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -t .

  burn:
    name: Burn tests (native builds, error corpus, self-hosting gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: tree-sitter CLI for the editor-grammar tests (MYLA-77)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts --prefix editor/tree-sitter-myla
          cd editor/tree-sitter-myla/node_modules/tree-sitter-cli && node install.js
      - name: Toolchain versions
        run: |
          python --version
          as --version | head -1
          ld --version | head -1
          editor/tree-sitter-myla/node_modules/.bin/tree-sitter --version
      - name: Burn tests
        run: python -m unittest discover -s tests/burn -t . -v

  bootstrap:
    name: Bootstrap fixed point
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stage 1–3 and compare stage2.s with stage3.s
        run: scripts/bootstrap.sh build
      - name: Self-hosted compiler builds and runs an example
        run: |
          build/stage3 examples/hello.my src/myla > build/hello.s
          as --64 -o build/hello.o build/hello.s
          ld -o build/hello build/hello.o
          build/hello

  vscode-extension:
    name: VS Code extension (typecheck, lint, tests, .vsix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension/myla
    steps:
      - uses: actions/checkout@v4
      # the debugger's integration test builds Myla programs with the Python
      # CLI (python3 myla.py build -g) and debugs them with gdb. It uses the
      # runner's own python3 (3.12): actions/setup-python sets LD_LIBRARY_PATH
      # to its libpython, which gdb then embeds instead of the one it was
      # built with, and the pretty-printers the binaries embed (D82) don't run
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-extension/myla/package-lock.json
      - name: gdb for the debugger tests (MYLA-99)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb
          gdb --version | head -1
          python3 --version
          gdb -batch -ex "python import sys; print('gdb embeds Python', sys.version.split()[0])"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests (unit, the bundle, the debug adapter against gdb)
        run: npm test
      - name: Package the .vsix
        run: npx vsce package
      - name: List the .vsix
        run: unzip -l *.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: myla-vscode-extension
          path: vscode-extension/myla/*.vsix
          if-no-files-found: error
